name: Publish Lance Test File

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-lance-file.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Put GREEN ZIP on main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download exact GREEN loader artifact
        uses: actions/download-artifact@v7
        with:
          name: GZFX-SkyrimSE-x64
          path: lance-artifact
          github-token: ${{ github.token }}
          run-id: 39730206559

      - name: Copy ZIP into Lance folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "LANCE YOUR FILE IS HERE"
          test -f "lance-artifact/GZFX-SkyrimSE-x64.zip"
          cp "lance-artifact/GZFX-SkyrimSE-x64.zip" "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip"
          sha256sum "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip"

      - name: Commit ZIP to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip"
          if git diff --cached --quiet; then
            echo "Exact ZIP is already present."
            exit 0
          fi
          git commit -m "chore: publish Lance Skyrim test package"
          git push origin HEAD:main
