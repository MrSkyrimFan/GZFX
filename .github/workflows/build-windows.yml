name: Windows x64

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "LANCE YOUR FILE IS HERE/**"
      - "GZFXWorkFolder/**"
      - "README.md"
      - "AGENT.md"

permissions:
  contents: write

jobs:
  build:
    name: Build Release x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install static build dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify GZFX PE load contract
        shell: pwsh
        run: ./scripts/verify-pe-contract.ps1 -DllPath build/bin/GZFX.dll

      - name: Runtime smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package SKSE plugin archive
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build -OutputDir dist

      - name: Verify package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("dist/GZFX-SkyrimSE-x64.zip")
          try {
            $actual = @(
              $zip.Entries |
                Where-Object { -not [string]::IsNullOrEmpty($_.Name) } |
                ForEach-Object { $_.FullName -replace '\\', '/' } |
                Sort-Object
            )
            $expected = @("Data/SKSE/Plugins/GZFX.dll")

            $zip.Entries | ForEach-Object { Write-Host $_.FullName }

            if ($actual.Count -ne $expected.Count -or
                (Compare-Object -ReferenceObject $expected -DifferenceObject $actual)) {
              throw "Unexpected GZFX package file contents."
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Upload GZFX SKSE package
        uses: actions/upload-artifact@v7
        with:
          name: GZFX-SkyrimSE-x64
          path: dist/GZFX-SkyrimSE-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish Lance test ZIP on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "LANCE YOUR FILE IS HERE" -Force | Out-Null
          Copy-Item "dist/GZFX-SkyrimSE-x64.zip" "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip"

          if (git diff --cached --quiet) {
            Write-Host "Lance ZIP is already current."
            exit 0
          }

          git commit -m "chore: refresh Lance Skyrim test package"
          git push origin HEAD:main
