name: Windows x64

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Runtime smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package root-ready archive
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build -OutputDir dist

      - name: Show package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("dist/GZFX-SkyrimSE-x64.zip")
          try {
            $zip.Entries | ForEach-Object { Write-Host $_.FullName }
          }
          finally {
            $zip.Dispose()
          }

      - name: Upload Skyrim root package
        uses: actions/upload-artifact@v4
        with:
          name: GZFX-SkyrimSE-x64
          path: dist/GZFX-SkyrimSE-x64.zip
          if-no-files-found: error
          retention-days: 30
