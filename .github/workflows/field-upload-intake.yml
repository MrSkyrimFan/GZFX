name: GZFX Field Upload Intake

on:
  push:
    branches:
      - main
    paths:
      - "GZFXWorkFolder/field_uploads/*.zip"

permissions:
  contents: read

jobs:
  unpack:
    name: Unpack latest GZFX field upload
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select and unpack field ZIPs
        id: select
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "GZFXWorkFolder/field_uploads"
          $changed = @()

          if ("${{ github.event.before }}" -and
              "${{ github.event.before }}" -ne "0000000000000000000000000000000000000000") {
            $changed = @(
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" |
                Where-Object {
                  $_ -like "GZFXWorkFolder/field_uploads/*.zip"
                }
            )
          }

          if ($changed.Count -gt 0) {
            $selected = @($changed)
          }
          else {
            $latest = Get-ChildItem $root -Filter "*.zip" -File |
              Sort-Object {
                if ($_.BaseName -match '(\d+)') {
                  [int]$Matches[1]
                }
                else {
                  -1
                }
              }, Name -Descending |
              Select-Object -First 1

            if ($null -eq $latest) {
              throw "No GZFX field ZIP was found."
            }

            $selected = @($latest.FullName)
          }

          $out = Join-Path $env:RUNNER_TEMP "gzfx-field-unpacked"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $manifest = Join-Path $out "_GZFX_FIELD_MANIFEST.txt"
          "archive_count=$($selected.Count)" | Set-Content $manifest -Encoding UTF8
          $labels = @()

          foreach ($entry in $selected) {
            $zip = (Resolve-Path $entry).Path
            $label = [IO.Path]::GetFileNameWithoutExtension($zip)
            $labels += $label
            $partOut = Join-Path $out $label
            New-Item -ItemType Directory -Force -Path $partOut | Out-Null

            Expand-Archive -LiteralPath $zip -DestinationPath $partOut -Force

            @(
              ""
              "source=$zip"
              "label=$label"
              "source_bytes=$((Get-Item $zip).Length)"
              "source_sha256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
              "FILES:"
            ) | Add-Content $manifest -Encoding UTF8

            Get-ChildItem $partOut -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($partOut, $_.FullName)
                "$label/$relative`t$($_.Length)" | Add-Content $manifest -Encoding UTF8
              }
          }

          $logical = $labels[0] -replace "(?i)(Telemetry|-part\d+)$", ""
          if ([string]::IsNullOrWhiteSpace($logical)) {
            $logical = $labels[0]
          }

          Get-Content $manifest
          "label=$logical" >> $env:GITHUB_OUTPUT
          "out=$out" >> $env:GITHUB_OUTPUT

      - name: Upload unpacked field evidence
        uses: actions/upload-artifact@v7
        with:
          name: GZFX-field-${{ steps.select.outputs.label }}
          path: ${{ steps.select.outputs.out }}
          if-no-files-found: error
          retention-days: 30
