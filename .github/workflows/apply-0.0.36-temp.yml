name: Apply 0.0.36 implementation

on:
  push:
    branches:
      - feature/0.0.36-unified-renderer
    paths:
      - .github/patches/0.0.36/**
      - .github/workflows/apply-0.0.36-temp.yml

permissions:
  contents: write

concurrency:
  group: apply-0.0.36-unified-renderer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: feature/0.0.36-unified-renderer
          fetch-depth: 0

      - name: Reconstruct and apply verified implementation
        shell: bash
        run: |
          set -euo pipefail

          cat .github/patches/0.0.36/chunk_* > /tmp/gzfx-0.0.36.patch.gz.b64
          echo "a88c8b6cde7e9d3e950e7cb143511d55f5b8c0a4f8af470eb165f76dc1e05fef  /tmp/gzfx-0.0.36.patch.gz.b64" | sha256sum -c -

          base64 --decode /tmp/gzfx-0.0.36.patch.gz.b64 | gzip --decompress > /tmp/gzfx-0.0.36.patch
          echo "7cd0099c9352b999936da6cd06bc719fbcb72e627a3d1316033b53c0b55d51e4  /tmp/gzfx-0.0.36.patch" | sha256sum -c -

          git apply --check /tmp/gzfx-0.0.36.patch
          git apply /tmp/gzfx-0.0.36.patch
          git diff --check

          rm -rf .github/patches/0.0.36
          rm -f .github/workflows/apply-0.0.36-temp.yml
          rm -f .github/workflows/source-snapshot-temp.yml

          git config user.name "GZFX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "runtime: build unified 0.0.36 product renderer"
          git push origin HEAD:feature/0.0.36-unified-renderer
