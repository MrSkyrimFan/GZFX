name: Temporary source snapshot

on:
  push:
    branches:
      - feature/0.0.36-unified-renderer

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: GZFX-source-snapshot
          path: |
            .github
            include
            src
            tests
            docs
            packaging
            scripts
            GZFXWorkFolder/new
            GZFXWorkFolder/old
            AGENT.md
            CMakeLists.txt
            README.md
            THIRD_PARTY_NOTICES.md
            vcpkg.json
          if-no-files-found: error
          retention-days: 1
