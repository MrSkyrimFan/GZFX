name: Apply missing 0.0.36 source files

on:
  push:
    branches:
      - feature/0.0.36-unified-renderer
    paths:
      - .github/patches/0.0.36-newfiles/**
      - .github/workflows/apply-0.0.36-newfiles-temp.yml

permissions:
  contents: write

concurrency:
  group: apply-0.0.36-newfiles
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: feature/0.0.36-unified-renderer
          fetch-depth: 0

      - name: Reconstruct and install verified source files
        shell: bash
        run: |
          set -euo pipefail

          cat .github/patches/0.0.36-newfiles/chunk_* > /tmp/gzfx-0.0.36-newfiles.tar.gz.b64
          echo "7808492ceb7eacc6ed7e3ad355426b0ceee300c7af2222cbd8d7966a4c238b57  /tmp/gzfx-0.0.36-newfiles.tar.gz.b64" | sha256sum -c -

          base64 --decode /tmp/gzfx-0.0.36-newfiles.tar.gz.b64 > /tmp/gzfx-0.0.36-newfiles.tar.gz
          echo "8d0198bdf677fea9a2ad2956fed8beed0cf7786e10b4e3511a0c22ae22e008bf  /tmp/gzfx-0.0.36-newfiles.tar.gz" | sha256sum -c -

          tar -xzf /tmp/gzfx-0.0.36-newfiles.tar.gz

          echo "1445f0e9063db9de2167e9c7f39441d3e8aeaaf73c087fc27fa6ff1715f33a10  include/gzfx/render/unified_product_math.hpp" | sha256sum -c -
          echo "81561ec60b79cd7e13ff07d12db69183deda9a32a26e6abe763929a5b2bfdc48  include/gzfx/render/unified_product_renderer.hpp" | sha256sum -c -
          echo "71efe9a65772f7863b9bf9f74546ca89a7b30dc044b0d569f9b1d80362665fd1  src/render/unified_product_renderer.cpp" | sha256sum -c -
          echo "53761384ce3c76354ac0a8797a4734e0e8f54bddc0fa9d8848355c89e1680fd3  tests/unified_product_contract_harness.cpp" | sha256sum -c -

          rm -rf .github/patches/0.0.36-newfiles
          rm -f .github/workflows/apply-0.0.36-newfiles-temp.yml

          git config user.name "GZFX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "runtime: add unified renderer source files"
          git push origin HEAD:feature/0.0.36-unified-renderer
