name: Temporary 0.0.34 package bridge

on:
  push:
    branches:
      - chore/0.0.34-package-bridge
    paths:
      - ".github/workflows/package-bridge-0.0.34.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download validated merged-main artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "_validated" | Out-Null
          gh run download 42127092035 --repo MrSkyrimFan/GZFX --name GZFX-SkyrimSE-x64 --dir "_validated"
          $source = "_validated/GZFX-SkyrimSE-x64.zip"
          if (-not (Test-Path $source)) { throw "Validated GZFX package was not downloaded." }
          New-Item -ItemType Directory -Force -Path "LANCE YOUR FILE IS HERE" | Out-Null
          Copy-Item $source "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip" -Force
          $hash = (Get-FileHash "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "package_sha256=$hash"

      - name: Commit validated package to bridge branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "LANCE YOUR FILE IS HERE/GZFX-SkyrimSE-x64.zip"
          if (git diff --cached --quiet) { Write-Host "Package already matches."; exit 0 }
          git commit -m "chore: stage validated 0.0.34 Lance package"
          git push origin HEAD:chore/0.0.34-package-bridge
